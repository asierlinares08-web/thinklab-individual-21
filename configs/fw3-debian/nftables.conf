#!/usr/sbin/nft -f
# /etc/nftables.conf · FW3-Debian-NFT (P7) · lo más simple que cumple la rúbrica
# enp0s3 = WAN (NAT de VirtualBox) · enp0s8 = LAN_21 (192.168.21.0/24)

# Borra las reglas anteriores para empezar de cero cada vez que se carga
flush ruleset

# Tabla "inet": vale para IPv4 e IPv6 a la vez
table inet filtro {

    # INPUT: tráfico dirigido AL PROPIO firewall
    chain input {
        type filter hook input priority 0; policy drop;   # por defecto, se descarta todo
        ct state established,related accept               # respuestas a conexiones que ya existen
        ct state invalid drop                             # paquetes que no encajan en ninguna conexión
        iif "lo" accept                                   # loopback (el sistema hablando consigo mismo)
        ip protocol icmp accept                           # ping (IPv4) para diagnosticar
        ip6 nexthdr icmpv6 accept                         # ICMPv6 (sin él IPv6 no funciona)
        iifname "enp0s8" tcp dport 22 accept              # SSH SOLO desde la LAN (nunca desde la WAN)
    }

    # FORWARD: tráfico que ATRAVIESA el firewall (LAN <-> Internet)
    chain forward {
        type filter hook forward priority 0; policy drop; # por defecto, no pasa nada
        ct state established,related accept               # respuestas de Internet a lo que pidió la LAN
        ct state invalid drop
        # Bloqueo de prueba: HTTP (TCP 80) desde la LAN. Va ANTES del "accept" LAN->WAN
        # porque nftables lee las reglas de arriba abajo y se queda con la primera que coincide.
        iifname "enp0s8" tcp dport 80 log prefix "P7-BLOQUEO-HTTP " drop
        iifname "enp0s8" oifname "enp0s3" accept          # el resto, de la LAN hacia Internet: permitido
    }

    # OUTPUT: lo que sale del propio firewall → todo permitido (no hace falta escribirlo)
}

# NAT: los equipos de la LAN salen a Internet con la IP de la WAN del firewall
table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oifname "enp0s3" masquerade                       # cambia la IP de origen por la de enp0s3
    }
}
